name: Run Data Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0:00 (北京时间 8:00)

permissions:
  contents: write

env:
  ATHLETE: 荆轲
  TITLE: 荆轲 Running
  TITLE_GRID: Over 10km Runs
  MIN_GRID_DISTANCE: 10
  BUILD_GH_PAGES: true

jobs:
  sync:
    name: Sync Data & Generate SVGs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ═══ Step 1: Sync Strava Data ═══
      - name: Sync Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_CLIENT_REFRESH_TOKEN: ${{ secrets.STRAVA_CLIENT_REFRESH_TOKEN }}
        run: python run_page/strava_sync.py "$STRAVA_CLIENT_ID" "$STRAVA_CLIENT_SECRET" "$STRAVA_CLIENT_REFRESH_TOKEN" --only-run

      # ═══ Step 2: Generate Custom SVGs ═══
      - name: Generate Track Wall SVGs
        run: python run_page/gen_trackwall.py

      - name: Generate Heatmap SVGs
        run: python run_page/gen_heatmap.py

      - name: Generate Running Life SVG
        run: python run_page/gen_runlife.py

      # ═══ Step 3: Push changes ═══
      - name: Push new data
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add .
          if git diff --cached --quiet; then
            echo 'nothing to commit'
          else
            git commit -m 'update new runs'
            git pull --rebase
            git push
          fi

  publish_github_pages:
    if: needs.sync.result == 'success'
    name: Build and publish GitHub Pages
    uses: ./.github/workflows/gh-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    needs:
      - sync
